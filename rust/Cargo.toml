[workspace]
resolver = "3"
members = ["crates/scripture-srs", "crates/scripture-srs-ffi", "crates/scripture-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MasterTemple/scripture-retention"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
